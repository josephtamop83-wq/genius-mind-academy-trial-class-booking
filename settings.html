<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>GMA Teacher - Settings</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
.wrap{max-width:640px;margin:0 auto;padding:16px 16px 60px}
.err{background:#fde8ea;color:var(--bad);border-radius:12px;padding:10px 12px;margin:10px 0;font-weight:700}
.okm{background:#e8f5d4;color:#3d6b10;border-radius:12px;padding:10px 12px;margin:10px 0;font-weight:700}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}.row small{display:block;color:var(--muted);font-weight:600}
select,input[type=date],input[type=text],input[type=tel]{padding:9px;border-radius:10px;border:1.5px solid var(--line);font:inherit;background:#fff}
.ov{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid var(--line)}
.ov select{flex:1;min-width:90px}.x{border:0;background:#fde8ea;color:var(--bad);border-radius:999px;width:32px;height:32px;font-weight:800;cursor:pointer}
.btn{cursor:pointer}
.navrow{max-width:640px;margin:8px auto 0;padding:0 14px;display:flex;gap:8px;align-items:center}
.navrow a,.navrow button{padding:8px 13px;border-radius:999px;border:1.5px solid #ddd;background:#fff;color:inherit;font:inherit;font-weight:800;font-size:13.5px;text-decoration:none;cursor:pointer;white-space:nowrap}
.navrow button{margin-left:auto}
#save,#login{width:100%;min-height:46px;margin-top:6px}
@media(max-width:520px){
.wrap{padding:10px 12px 40px}.card{padding:14px}
.row{flex-direction:column;align-items:stretch;gap:6px}.row select{width:100%}
.ov{gap:6px}.ov input[type=date],.ov select[data-os]{flex:1 1 100%}.ov select[data-oc]{flex:1 1 auto}
.ov.tr{display:grid;grid-template-columns:1fr 1fr}.ov.tr b{grid-column:1/-1;width:auto!important}
.ov.tr input{width:100%;min-width:0!important}
}
</style>
</head>
<body>
<header class="top">
<div class="logo" id="logo"></div>
<div><div class="t1">Genius Mind <b>Academy</b></div><div class="t2">Teacher &middot; Settings</div></div>
</header>
<div class="navrow"><a href="teachers.html">&larr; Teacher menu</a><button id="navlogout" type="button" onclick="try{sessionStorage.removeItem('gma_pin');sessionStorage.removeItem('gma_view_pin')}catch(e){}location.reload()">Log out</button></div>
<main class="wrap" id="app"></main>
<script>
var SUBMIT_URL = 'https://script.google.com/macros/s/AKfycbwvukSXQHKhnbMndouaYUC07qpx_2tXQWkbUTIYsrCB8gSbByjQ7u0zqkKu4RiY66E7/exec';
var LOGO_URL = 'logo.png';
var PIN = ''; try { PIN = sessionStorage.getItem('gma_pin') || ''; } catch (e) {}
var app = document.getElementById('app');
var S = { authed: false, busy: false, err: '', msg: '', caps: { BT: 1, TC: 2, TCBT: 2 }, maxChanges: 2, lockHours: 24, over: [], teachers: [] };
var NAMES = { BT: 'Brain Test Report Collection', TC: 'Trial Class', TCBT: 'Trial Class + Brain Test' };
var ERR = { auth: 'Wrong password.', locked: 'Too many wrong passwords. Try again in 5 minutes.', disabled: 'Teacher password is not turned on yet.' };
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function api(body, cb) {
  body.pin = PIN; var tries = 0;
  (function go() {
    tries++;
    var ac = window.AbortController ? new AbortController() : null, to = setTimeout(function () { if (ac) ac.abort(); }, 15000);
    fetch(SUBMIT_URL, { method: 'POST', body: JSON.stringify(body), signal: ac ? ac.signal : undefined }).then(function (r) { return r.json(); }).then(function (j) { clearTimeout(to); cb(j); }).catch(function () { clearTimeout(to); cb(null); });
  })();
}
var LOCK_UNTIL = 0, lockTimer = null;
function lockMsg() { var s = Math.max(0, Math.ceil((LOCK_UNTIL - Date.now()) / 1000)); return 'Too many wrong passwords. Try again in ' + Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2) + '.'; }
function startLock(sec) { LOCK_UNTIL = Date.now() + sec * 1000; clearInterval(lockTimer); lockTimer = setInterval(function () { if (Date.now() >= LOCK_UNTIL) { clearInterval(lockTimer); S.err = ''; render(); return; } var e = document.querySelector('.err'); if (e) e.textContent = lockMsg(); }, 1000); }
document.addEventListener('click', function (e) { if (e.target.closest && e.target.closest('#login') && Date.now() < LOCK_UNTIL) { e.stopImmediatePropagation(); e.preventDefault(); } }, true);   // while locked, extra tries do nothing and do not restart the timer
function errText(j) { if (!j && S.slow) return 'The server is slow right now. Please tap Log in again.'; if (j && /^locked/.test(j.error || '')) { startLock(parseInt((j.error.split(':')[1] || 300), 10) || 300); return lockMsg(); } return !j ? 'Could not connect. Check the internet and try again (nothing was saved if this was a Save).' : (ERR[j.error] || ('Error: ' + j.error)); }
function opts(from, to, cur, label) { var h = ''; for (var i = from; i <= to; i++) h += '<option value="' + i + '"' + (i === cur ? ' selected' : '') + '>' + i + (label ? ' ' + label : '') + '</option>'; return h; }
function take(j) { S.caps = j.caps; S.maxChanges = j.maxChanges; S.lockHours = j.lockHours; S.over = j.over || []; S.teachers = j.teachers || []; }
function render() {
  var h = '';
  if (!S.authed) {
    var cur = document.getElementById('pin'), had = cur && document.activeElement === cur, val = cur ? cur.value : PIN;
    h += '<div class="card"><h2>Teacher login</h2><label>Password</label><input type="password" id="pin" autocomplete="current-password" value="' + esc(val) + '">';
    if (S.err) h += '<div class="err">' + esc(S.err) + '</div>';
    h += '<button class="btn pri" id="login"' + (S.busy ? ' disabled' : '') + '>' + (S.busy ? 'Please wait...' : 'Log in') + '</button></div>';
    app.innerHTML = h; if (had) { var ni = document.getElementById('pin'); ni.focus(); try { ni.setSelectionRange(val.length, val.length); } catch (x) {} } return;
  }
  h += '<div class="card"><h2>Parents per time slot</h2><p class="small" style="color:var(--muted)">How many parents may book the same date &amp; time. Applies to new bookings and changes.</p>';
  ['BT', 'TC', 'TCBT'].forEach(function (k) { h += '<div class="row"><div><b>' + NAMES[k] + '</b></div><select data-cap="' + k + '">' + opts(1, 3, S.caps[k], 'parent' + '(s)') + '</select></div>'; });
  h += '</div><div class="card"><h2>Date changes</h2>';
  h += '<div class="row"><div><b>Changes allowed per booking</b><small>0 = parents cannot change</small></div><select id="mc">' + opts(0, 10, S.maxChanges) + '</select></div>';
  h += '<div class="row"><div><b>Lock before appointment</b><small>Hours before the booking when changes stop</small></div><select id="lh">' + opts(0, 240, S.lockHours).replace(/>(\d+)</g, '>$1 h<') + '</select></div></div>';
  h += '<div class="card"><h2>Special dates (optional)</h2><p class="small" style="color:var(--muted)">Use a different number for one date only, e.g. a busy Saturday.</p>';
  S.over.forEach(function (o, i) {
    h += '<div class="ov"><input type="date" data-od="' + i + '" value="' + esc(o.date) + '"><select data-os="' + i + '">';
    ['BT', 'TC', 'TCBT'].forEach(function (k) { h += '<option value="' + k + '"' + (o.svc === k ? ' selected' : '') + '>' + NAMES[k] + '</option>'; });
    h += '</select><select data-oc="' + i + '">' + opts(1, 3, o.cap, 'parent(s) per slot') + '</select><button class="x" data-del="' + i + '" type="button">&times;</button></div>';
  });
  h += '<button class="btn sec2" id="addov" type="button" style="margin-top:10px">+ Add a special date</button></div>';
  h += '<div class="card"><h2>Follow-up teachers (up to 10)</h2><p class="small" style="color:var(--muted)">Name and WhatsApp number of each teacher / sales person. Teachers pick themselves for each parent on the Spin &amp; Win teacher page.</p>';
  for (var t = 0; t < 10; t++) { var T = S.teachers[t] || {}; h += '<div class="ov tr"><b style="width:74px">Teacher ' + (t + 1) + '</b><input type="text" data-tn="' + t + '" placeholder="Name" value="' + esc(T.name || '') + '" style="flex:1;min-width:110px"><input type="tel" data-tp="' + t + '" placeholder="Phone" value="' + esc(T.phone || '') + '" style="flex:1;min-width:130px"></div>'; }
  h += '</div>';
  if (S.err) h += '<div class="err">' + esc(S.err) + '</div>';
  if (S.msg) h += '<div class="okm">' + esc(S.msg) + '</div>';
  h += '<button class="btn pri" id="save"' + (S.busy ? ' disabled' : '') + '>' + (S.busy ? 'Saving...' : 'Save settings') + '</button>';
  app.innerHTML = h;
}
function readForm() {
  document.querySelectorAll('[data-cap]').forEach(function (e) { S.caps[e.dataset.cap] = parseInt(e.value, 10); });
  S.maxChanges = parseInt(document.getElementById('mc').value, 10); S.lockHours = parseInt(document.getElementById('lh').value, 10);
  S.teachers = []; for (var t = 0; t < 10; t++) S.teachers.push({ n: t + 1, name: document.querySelector('[data-tn="' + t + '"]').value.trim(), phone: document.querySelector('[data-tp="' + t + '"]').value.trim() });
  S.over.forEach(function (o, i) {
    o.date = document.querySelector('[data-od="' + i + '"]').value; o.svc = document.querySelector('[data-os="' + i + '"]').value; o.cap = parseInt(document.querySelector('[data-oc="' + i + '"]').value, 10);
  });
}
function load() {
  S.busy = true; S.err = ''; render();
  api({ action: 'staff_settings' }, function (j) {
    S.busy = false; S.slow = !j;
    if (j && j.ok) { S.authed = true; take(j); try { sessionStorage.setItem('gma_pin', PIN); } catch (x) {} } else { S.authed = false; S.err = PIN || j ? errText(j) : ''; }
    render();
  });
}
document.addEventListener('click', function (e) {
  var el = e.target.closest('button'); if (!el) return;
  if (el.id === 'login') { PIN = document.getElementById('pin').value; load(); }
  else if (el.id === 'addov') { readForm(); S.over.push({ date: '', svc: 'BT', cap: 2 }); S.msg = ''; render(); }
  else if (el.dataset.del !== undefined) { readForm(); S.over.splice(parseInt(el.dataset.del, 10), 1); S.msg = ''; render(); }
  else if (el.id === 'save') {
    readForm();
    for (var i = 0; i < S.over.length; i++) if (!S.over[i].date) { S.err = 'Please choose a date for every special date (or remove it).'; S.msg = ''; render(); return; }
    S.busy = true; S.err = ''; S.msg = ''; render();
    api({ action: 'staff_settings_save', caps: S.caps, maxChanges: S.maxChanges, lockHours: S.lockHours, over: S.over, teachers: S.teachers }, function (j) {
      S.busy = false;
      if (j && j.ok) { take(j); S.msg = 'Saved. New settings are live now.'; } else S.err = errText(j);
      render(); window.scrollTo(0, document.body.scrollHeight);
    });
  }
});
document.addEventListener('keydown', function (e) { if (e.key === 'Enter' && e.target.id === 'pin') document.getElementById('login').click(); });
if (LOGO_URL) { var lg = document.getElementById('logo'), im = new Image(); im.className = 'brandlogo'; im.alt = ''; im.src = LOGO_URL; im.onload = function () { lg.replaceWith(im); }; }
if (PIN) { S.busy = true; render(); api({ action: 'staff_settings' }, function (j) { S.busy = false; if (j && j.ok) { S.authed = true; take(j); } else { try { sessionStorage.removeItem('gma_pin'); } catch (x) {} PIN = ''; S.err = j ? errText(j) : ''; } render(); }); } else render();
</script>
</body>
</html>
