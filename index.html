<script data-field-replace>
(function(){
  var params=new URLSearchParams(window.location.search);
  var fields={};
  var paramMap={
    'first_name':'firstName','last_name':'lastName','full_name':'fullName',
    'email':'email','phone':'phone','company':'company',
    'city':'city','state':'state','country':'country'
  };
  var skipTags={'SCRIPT':1,'STYLE':1,'NOSCRIPT':1,'TEXTAREA':1,'CODE':1,'PRE':1};
  var hasUrlFields=false;
  for(var p in paramMap){
    var v=params.get(p);
    if(v){fields[paramMap[p]]=v;hasUrlFields=true;}
  }
  var contactId=params.get('contact_id');
  function esc(s){
    if(!s)return s;
    var d=document.createElement('div');
    d.appendChild(document.createTextNode(s));
    return d.innerHTML;
  }
  function doReplace(data){
    var r={};
    r['{{full_name}}']=esc(((data.firstName||'')+' '+(data.lastName||'')).trim()||((data.fullName||data.name)||''));
    r['{{first_name}}']=esc(data.firstName||(data.name?data.name.split(' ')[0]:'')||'');
    r['{{last_name}}']=esc(data.lastName||(data.name&&data.name.indexOf(' ')>-1?data.name.substring(data.name.indexOf(' ')+1):'')||'');
    r['{{email}}']=esc(data.email||'');
    r['{{phone}}']=esc(data.phone||'');
    r['{{company}}']=esc(data.company||'');
    r['{{city}}']=esc(data.city||'');
    r['{{state}}']=esc(data.state||'');
    r['{{country}}']=esc(data.country||'');
    r['{{date}}']=new Date().toLocaleDateString();
    r['{{time}}']=new Date().toLocaleTimeString();
    r['{{location}}']=[data.city,data.state,data.country].filter(Boolean).join(', ');
    r['{{tracking_id}}']=esc(data.trackingId||'');
    r['{{lastClickedProduct}}']=esc(data.lastClickedProduct||'');
    r['{{lastProductClickDate}}']=esc(data.lastProductClickDate||'');
    r['{{lastClickedProductPrice}}']=esc(data.lastClickedProductPrice||'');
    r['{{lastClickedProductURL}}']=esc(data.lastClickedProductURL||'');
    r['{{productsClickedCount}}']=esc(data.productsClickedCount||'0');
    r['{{ip_address}}']=esc(data.ipAddress||'');
    r['{{ip}}']=esc(data.ipAddress||'');
    if(data.customFields){
      for(var k in data.customFields){
        r['{{'+k+'}}']=esc(String(data.customFields[k]||''));
      }
    }
    params.forEach(function(v,k){
      if(!paramMap[k]&&k!=='contact_id'&&k!=='page_id'&&k.indexOf('utm_')!==0){
        r['{{'+k+'}}']=esc(v);
      }
    });
    var hasValues=false;
    for(var key in r){if(r[key]){hasValues=true;break;}}
    if(!hasValues)return;
    var walker=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT,{
      acceptNode:function(n){
        var p=n.parentNode;
        if(p&&skipTags[p.nodeName])return NodeFilter.FILTER_REJECT;
        return NodeFilter.FILTER_ACCEPT;
      }
    });
    var node;
    while(node=walker.nextNode()){
      var txt=node.nodeValue;
      if(txt&&txt.indexOf('{{')>-1){
        var changed=txt;
        for(var ph in r){
          if(r[ph]&&changed.indexOf(ph)>-1){
            changed=changed.split(ph).join(r[ph]);
          }
        }
        if(changed!==txt)node.nodeValue=changed;
      }
    }
    var attrs=['value','placeholder','content','alt','title'];
    attrs.forEach(function(attr){
      var els=document.querySelectorAll('['+attr+'*="{{"]');
      for(var i=0;i<els.length;i++){
        var tag=els[i].tagName;
        if(skipTags[tag])continue;
        var val=els[i].getAttribute(attr);
        if(val){
          var nv=val;
          for(var ph in r){
            if(r[ph]&&nv.indexOf(ph)>-1){
              nv=nv.split(ph).join(r[ph]);
            }
          }
          if(nv!==val)els[i].setAttribute(attr,nv);
        }
      }
    });
  }
  function run(){
    if(contactId){
      var xhr=new XMLHttpRequest();
      xhr.open('GET','https://my.chatbees.io/api/landing/context/'+encodeURIComponent(contactId)+'?page_id=9214');
      xhr.onload=function(){
        if(xhr.status===200){
          try{
            var resp=JSON.parse(xhr.responseText);
            if(resp.success&&resp.contact){
              var merged=resp.contact;
              for(var k in fields){merged[k]=fields[k];}
              doReplace(merged);
              return;
            }
          }catch(e){}
        }
        if(hasUrlFields)doReplace(fields);
      };
      xhr.onerror=function(){if(hasUrlFields)doReplace(fields);};
      xhr.send();
    }else if(hasUrlFields){
      doReplace(fields);
    }
  }
  if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',run);}
  else{run();}
})();
</script>

h+='<div class="sec" style="margin-top:6px">'+t('slots')+' · '+esc(fmtDate(S.date))+'</div><div class="slots">';
tb[S.date].forEach(function(l){var tk2=taken(k,S.date,l);
h+='<button class="slot'+(S.slot===l?' sel':'')+(tk2?' taken':'')+'" data-slot="'+l+'"'+(tk2?' disabled':'')+'><b>'+l+'</b><span>'+(tk2?t('taken'):t('free_slot'))+'</span></button>'});
h+='</div>';
if(S.slot&&S.service==='TCBT'){
var rf=reportFor(S.date,S.slot);
if(!rf)h+='<div class="note">'+t('report_none')+'</div>';
else if(taken('report',S.date,rf))h+='<div class="note">'+t('report_dup')+'</div>';
else h+='<div class="note info">'+t('report_note',{t:'<b>'+rf+'</b>'})+'</div>';
}
}else h+='<div class="hint" style="text-align:center">'+t('pick_date')+'</div>';
return h;
}

function viewConfirm(){
var d=S.d,rows=[[t('svc'),svcName()],[t('who'),d.parent],[t('ph'),d.phone]];
rows.push([t('kids'),d.children.map(function(c){return c.name+' ('+(c.gender==='M'?t('male'):t('female'))+', '+c.age+')'}).join('; ')]);
if(S.service!=='BT')rows.push([t('tcd'),fmtDate(S.date)+' · '+S.slot]);
if(S.service==='TCBT'){var rf=reportFor(S.date,S.slot);rows.push([t('btd'),rf?(fmtDate(S.date)+' · '+rf+(taken('report',S.date,rf)?' ⚠':'')):t('report_none')])}
if(S.service==='BT')rows.push([t('btd'),fmtDate(S.date)+' · '+S.slot]);
var h='<div class="head"><h2>'+t('h_confirm')+'</h2><p>'+t('p_confirm')+'</p></div>'+(S.holdUntil?'<div class="hold">⏱ '+t('hold',{t:'<span id="holdtxt"></span>'})+'</div>':'');
h+='<div class="card sum"><dl>'+rows.map(function(r){return '<dt>'+esc(r[0])+'</dt><dd>'+esc(r[1])+'</dd>'}).join('')+'</dl></div>';
if(S.service==='TCBT'){var r2=reportFor(S.date,S.slot);if(r2&&taken('report',S.date,r2))h+='<div class="note">'+t('report_dup')+'</div>'}
return h;
}
function doneView(){
var b=S.done,wa='';
if(b.waSent)wa='<div class="note info">'+t('wa_ok')+'</div>';
else if(CFG.WHATSAPP){var msg='Hi Genius Mind Academy, I have booked ('+svcName()+'). Ref: '+b.ref+(b.service!=='BT'?' | '+b.date+' '+b.slot:'')+(b.reportSlot&&b.service!=='TC'?' | Report: '+(b.reportDate||b.date)+' '+b.reportSlot:'');
wa='<a class="btn pri" style="max-width:300px;text-decoration:none;display:inline-block;margin:6px 0" target="_blank" rel="noopener" href="https://wa.me/'+CFG.WHATSAPP+'?text='+encodeURIComponent(msg)+'">'+t('wa_btn')+'</a>'}
else wa='<p>'+t('wa_later')+'</p>';
return '<div class="card done-card"><div class="tick">✓</div><h2>'+t('done')+'</h2><div>'+t('done_p')+'</div><div class="ref">'+esc(b.ref)+'</div>'+wa+
(CFG.SUBMIT_URL?'':'<div class="note">'+t('demo')+'</div>')+'</div>';
}
function validate(cur){
var d=S.d,mn=minKids(),mx=CFG.MAX_CHILDREN;
if(cur==='phone'&&!/^(\+?6?0)1\d[- ]?\d{7,8}$/.test(d.phone.replace(/\s/g,'')))return t('e_phone');
if(cur==='service'&&!S.service)return t('e_service');
if(cur==='details'){
if(!d.parent.trim())return t('e_req');
if(d.children.length<mn||d.children.length>mx||d.children.some(function(c){return !c.name.trim()||!c.gender||!(+c.age>=1&&+c.age<=18)}))return t('e_kids',{min:mn,max:mx});
if(!d.consent)return t('e_consent');
}
if(cur==='date'&&(!S.date||!S.slot))return t('e_slot');
return '';
}
function lookup(phone,cb){
var n=normPhone(phone);
if(!CFG.SUBMIT_URL){var bk=store().bookings.filter(function(x){return normPhone(x.phone)===n}).pop();
cb(bk?{ok:true,found:true,parent:bk.parent,children:bk.children,booking:{ref:bk.ref,service:bk.service,date:bk.date,slot:bk.slot,reportDate:bk.service==='BT'?bk.date:(bk.reportSlot?bk.date:''),reportSlot:bk.reportSlot}}:{ok:true,found:false});return}
fetch(CFG.SUBMIT_URL,{method:'POST',body:JSON.stringify({action:'lookup',phone:n})}).then(function(r){return r.json()}).then(cb).catch(function(){cb(null)})
}
function go(delta){
if(S.mode){if(delta<0){S.mode=null;S.err='';stopHold();render();window.scrollTo(0,0)}else saveEdit();return}
var st=steps(),cur=st[S.step];
if(delta>0){S.err=validate(cur);if(S.err){render();return}
if(cur==='phone'){
var n=normPhone(S.d.phone);
if(S.looked===n&&!S.existing){S.step++;render();window.scrollTo(0,0);return}
S.busy=true;render();
lookup(S.d.phone,function(j){S.busy=false;
if(!j||!j.ok){S.err=t('e_lookup');render();return}
S.looked=n;S.welcome='';
if(j.found&&j.parent){S.d.parent=j.parent;if(j.children&&j.children.length)S.d.children=j.children.map(function(c){return {name:c.name||'',gender:c.gender||'',age:c.age||''}})}
if(j.found&&j.booking){S.existing=j.booking}
else{S.welcome=j.found&&j.parent?t('welcome_back',{n:j.parent}):t('new_here');S.step=1;S.err=''}
render();window.scrollTo(0,0)});
return}
if(cur==='confirm'){submit();return}}
S.step=Math.max(0,Math.min(st.length-1,S.step+delta));S.err='';render();window.scrollTo(0,0);
}
function submit(){
var K=kind(),m=store(),rf=null;
fresh();
if(taken(K,S.date,S.slot)){S.err=t('e_taken');S.step=steps().indexOf('date');S.slot=null;stopHold();render();return}
var dup=false;
if(S.service==='TCBT'){rf=reportFor(S.date,S.slot);if(rf&&taken('report',S.date,rf))dup=true}
var pf=S.service==='TCBT'?'TB':S.service==='TC'?'TC':'BR';
var st=range(S.slot)[0],hhmm=pad(Math.floor(st/60))+pad(st%60);
var ref0=pf+S.date.replace(/-/g,'')+'-'+hhmm+'-';
var seq=store().bookings.filter(function(x){return x.ref.indexOf(pf)===0&&/^[A-Z]{2}\d{8}-/.test(x.ref)}).length+1;
var ref=ref0+('00'+seq).slice(-3);
var b={ref:ref,service:S.service,date:S.date,slot:S.slot,reportSlot:S.service==='TCBT'?rf:(S.service==='BT'?S.slot:null),duplicateReport:dup,
parent:S.d.parent,phone:normPhone(S.d.phone),children:S.d.children,created:new Date().toISOString()};
S.busy=true;render();
var finish=function(){
var mm=store();mm[K][S.date+'|'+S.slot]=b.ref;
if(S.service==='TCBT'&&rf&&!dup)mm.report[S.date+'|'+rf]=b.ref;
mm.bookings.push(b);save(mm);
S.busy=false;S.done=b;stopHold();render();window.scrollTo(0,0);
};
if(!CFG.SUBMIT_URL){setTimeout(finish,400);return}
fetch(CFG.SUBMIT_URL,{method:'POST',body:JSON.stringify(b)}) // text/plain body -> no CORS preflight (Apps Script)
.then(function(r){return r.json()}).then(function(j){
if(j&&j.ok){if(j.ref)b.ref=j.ref;b.duplicateReport=!!j.duplicateReport;b.waSent=!!j.waSent;finish();return}
throw (j&&j.error)||'err';
}).catch(function(e){S.busy=false;
if(e==='taken'){S.err=t('e_taken');S.step=steps().indexOf('date');S.slot=null;stopHold();loadRemote(render);return}
if(e==='phone_used'){S.err=t('e_used');render();return}
S.err=t('e_send');render()});
}
function footRender(){var f=document.getElementById('foot');if(f)f.innerHTML=linksHtml()}
function editRender(){
document.documentElement.lang=S.lang==='zh'?'zh-CN':'en';
document.getElementById('sub').textContent=t('sub');
document.querySelectorAll('.lang button').forEach(function(b){b.classList.toggle('on',b.dataset.lang===S.lang)});
var h='<div class="note info">'+t('ref_lbl')+': <b>'+esc(S.existing.ref)+'</b></div>';
if(S.mode==='edit-date')h+=viewDate();
else h+='<div class="head" style="margin-top:12px"><h2>'+t('h_edit_det')+'</h2><p>'+t('p_edit_det')+'</p></div>'+viewDetails().replace(/^<div class="head">[\s\S]*?<\/div><div class="card">/,'<div class="card">').replace(/<label class="check">[\s\S]*$/,'');
if(S.err)h+='<div class="msg" role="alert">'+esc(S.err)+'</div>';
app.innerHTML=h;
bar.hidden=false;backB.style.visibility='visible';
backB.textContent='← '+t('cancel_edit');
nextB.textContent=S.busy?t('sending'):t('save');nextB.disabled=S.busy;
tick();
}
function bkView(bk){return {ref:bk.ref,service:bk.service,date:bk.date,slot:bk.slot,reportDate:bk.service==='BT'?bk.date:(bk.reportSlot?bk.date:''),reportSlot:bk.reportSlot}}
function editApi(body,cb){
if(CFG.SUBMIT_URL){fetch(CFG.SUBMIT_URL,{method:'POST',body:JSON.stringify(body)}).then(function(r){return r.json()}).then(cb).catch(function(){cb(null)});return}
setTimeout(function(){
MEM=load();var mm=MEM,bk=mm.bookings.filter(function(x){return x.ref===body.ref&&normPhone(x.phone)===normPhone(body.phone)})[0];
if(!bk){cb({ok:false,error:'notfound'});return}
if(body.action==='update'){bk.parent=body.parent;bk.children=body.children;save(mm);cb({ok:true,booking:bkView(bk)});return}
var K=bk.service==='BT'?'report':'trial',oldMain=bk.date+'|'+bk.slot,oldRep=bk.service==='TCBT'&&bk.reportSlot?bk.date+'|'+bk.reportSlot:null;
delete mm[K][oldMain];if(oldRep)delete mm.report[oldRep];
if(mm[K][body.date+'|'+body.slot]){mm[K][oldMain]=bk.ref;if(oldRep)mm.report[oldRep]=bk.ref;cb({ok:false,error:'taken'});return}
var dup=!!(body.reportSlot&&bk.service==='TCBT'&&mm.report[body.date+'|'+body.reportSlot]);
mm[K][body.date+'|'+body.slot]=bk.ref;if(bk.service==='TCBT'&&body.reportSlot&&!dup)mm.report[body.date+'|'+body.reportSlot]=bk.ref;
bk.date=body.date;bk.slot=body.slot;bk.reportSlot=body.reportSlot;bk.duplicateReport=dup;save(mm);cb({ok:true,booking:bkView(bk)});
},300)
}
function saveEdit(){
var ex=S.existing,d=S.d,body;
S.service=ex.service;
if(S.mode==='edit-details'){
var mn=minKids(),mx=CFG.MAX_CHILDREN;
if(!d.parent.trim()){S.err=t('e_req');render();return}
if(d.children.length<mn||d.children.length>mx||d.children.some(function(c){return !c.name.trim()||!c.gender||!(+c.age>=1&&+c.age<=18)})){S.err=t('e_kids',{min:mn,max:mx});render();return}
body={action:'update',phone:normPhone(d.phone),ref:ex.ref,parent:d.parent,children:d.children};
}else{
if(!S.date||!S.slot){S.err=t('e_slot');render();return}
var rf=ex.service==='TCBT'?reportFor(S.date,S.slot):(ex.service==='BT'?S.slot:null);
body={action:'reschedule',phone:normPhone(d.phone),ref:ex.ref,date:S.date,slot:S.slot,reportSlot:rf};
}
S.err='';S.busy=true;render();
editApi(body,function(j){S.busy=false;
if(j&&j.ok){S.existing=j.booking;S.mode=null;stopHold();S.date=null;S.slot=null;render();toast(t('saved'));window.scrollTo(0,0);return}
if(j&&j.error==='taken'){S.err=t('e_taken');S.slot=null;stopHold();loadRemote(render);return}
S.err=t('e_send');render()});
}
function fresh(){if(!CFG.SUBMIT_URL)MEM=load()}
function loadRemote(cb){if(!CFG.SUBMIT_URL){if(cb)cb();return}
fetch(CFG.SUBMIT_URL+'?action=booked').then(function(r){return r.json()}).then(function(j){MEM={trial:j.trial||{},report:j.report||{},bookings:[]};if(cb)cb()}).catch(function(){if(cb)cb()})}
document.addEventListener('click',function(e){
var el=e.target.closest('[data-svc],[data-date],[data-slot],[data-nav],[data-rm],#addkid,#again,#chgnum,#ed_date,#ed_det,[data-lang]');if(!el)return;
if(el.dataset.lang){S.lang=el.dataset.lang;render();return}
if(el.dataset.svc){S.service=el.dataset.svc;
var mn=minKids();while(S.d.children.length<mn)S.d.children.push({name:'',gender:'',age:''});
S.date=null;S.slot=null;stopHold();S.err='';render();return}
if(el.dataset.nav){S.month[1]+=+el.dataset.nav;render();return}
if(el.dataset.date){S.date=el.dataset.date;S.slot=null;stopHold();S.err='';render();return}
if(el.dataset.slot){S.slot=el.dataset.slot;S.err='';startHold();render();return}
if(el.dataset.rm!==undefined){S.d.children.splice(+el.dataset.rm,1);render();return}
if(el.id==='addkid'){if(S.d.children.length<CFG.MAX_CHILDREN)S.d.children.push({name:'',gender:'',age:''});render();return}
if(el.id==='again'){location.reload()}
if(el.id==='ed_date'){S.mode='edit-date';S.service=S.existing.service;S.date=null;S.slot=null;S.month=[2026,11];S.err='';stopHold();render();window.scrollTo(0,0);return}
if(el.id==='ed_det'){S.mode='edit-details';S.service=S.existing.service;S.err='';render();window.scrollTo(0,0);return}
if(el.id==='chgnum'){S.mode=null;S.existing=null;S.looked='';S.d.phone='';S.welcome='';S.step=0;render()}
});
document.addEventListener('input',function(e){
var el=e.target;
if(el.dataset.f){S.d[el.dataset.f]=el.type==='checkbox'?el.checked:el.value;if(el.type!=='checkbox')S.err=''}
else if(el.dataset.c!==undefined){S.d.children[+el.dataset.c][el.dataset.k]=el.value}
});
document.addEventListener('change',function(e){
var el=e.target;
if(el.dataset.f&&el.tagName==='SELECT')S.d[el.dataset.f]=el.value;
});
nextB.addEventListener('click',function(){go(1)});
backB.addEventListener('click',function(){go(-1)});
if(CFG.LOGO_URL){var hd=document.querySelector('header.top'),lg=document.getElementById('logo'),tt=lg.nextElementSibling;
var im=new Image();im.alt='Genius Mind Academy';im.className='brandlogo';im.src=CFG.LOGO_URL;
im.onload=function(){lg.replaceWith(im);var t1=tt.querySelector('.t1');if(t1)t1.style.display='none'};
}
render();
loadRemote(render);
</script>
</body>
</html>
