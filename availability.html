<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>GMA Teacher - Open Dates</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
.wrap{max-width:1200px;margin:0 auto;padding:16px 12px 70px}
.err{background:#fde8ea;color:var(--bad);border-radius:12px;padding:10px 12px;margin:10px 0;font-weight:700}
.okm{background:#e8f5d4;color:#3d6b10;border-radius:12px;padding:10px 12px;margin:10px 0;font-weight:700}
.navrow{max-width:1200px;margin:8px auto 0;padding:0 12px;display:flex;gap:8px;align-items:center}
.navrow a,.navrow button{padding:8px 13px;border-radius:999px;border:1.5px solid #ddd;background:#fff;color:inherit;font:inherit;font-weight:800;font-size:13.5px;text-decoration:none;cursor:pointer;white-space:nowrap}
.navrow button{margin-left:auto}
#login{width:100%;min-height:46px;margin-top:6px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 10px}
.tabs button{padding:10px 16px;border-radius:999px;border:2px solid #ddd;background:#fff;font:inherit;font-weight:800;cursor:pointer}
.tabs button.on{background:#fb5f3b;border-color:#fb5f3b;color:#fff}
.legend{display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin:6px 0 10px;font-weight:700;font-size:14px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.lg{font-style:normal;display:inline-flex;flex:none;width:26px;height:22px;border:1px solid #bbb;align-items:center;justify-content:center;font-size:13px;font-weight:800}
.gridbox{overflow:auto;border:1px solid #ccc;border-radius:10px;background:#fff;max-height:70vh}
table.g{border-collapse:separate;border-spacing:0;font-size:13px}
table.g th,table.g td{border-right:1px solid #e3e3e3;border-bottom:1px solid #e3e3e3;text-align:center;padding:0}
table.g thead th{position:sticky;top:0;background:#c8c8c8;z-index:2;min-width:46px;padding:5px 2px;cursor:pointer;font-weight:800;line-height:1.25}
table.g thead th small{display:block;font-weight:700;font-size:11px}
table.g thead th.we{background:#b4b4b4}
table.g thead th.corner{left:0;z-index:4;min-width:150px;cursor:default;background:#c8c8c8}
table.g tbody th{position:sticky;left:0;background:#c8c8c8;z-index:1;text-align:left;padding:7px 8px;white-space:nowrap;font-weight:800}
td.c{height:34px;min-width:46px;cursor:pointer;font-weight:800;user-select:none}
td.c.open{background:#fff;color:#222}
td.c.closed{background:#d9f2d4;color:transparent}
td.c.blk{background:repeating-linear-gradient(45deg,#e4e4e4,#e4e4e4 6px,#f2f2f2 6px,#f2f2f2 12px);color:#777;cursor:not-allowed;font-size:12px}
td.c.bad{background:#fbd0d0;color:#a01818;outline:2px solid #d33;outline-offset:-2px}
td.c.lock{background:#fff4d6;color:#8a5a00;cursor:not-allowed;outline:2px solid #f0b429;outline-offset:-2px}
td.c.chg{box-shadow:inset 0 0 0 3px #fb5f3b}
td.c:hover{filter:brightness(.94)}
.bar{position:sticky;bottom:0;background:#fffffff2;border-top:1px solid #ddd;padding:10px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px;border-radius:12px 12px 0 0}
.bar .grow{flex:1;font-weight:700}
.btn{cursor:pointer}
.bar button{min-height:44px;padding:0 22px}
.hint{color:var(--muted);font-weight:600;font-size:13.5px;margin:4px 0 8px}
</style>
</head>
<body>
<header class="top">
<div class="logo" id="logo"></div>
<div><div class="t1">Genius Mind <b>Academy</b></div><div class="t2">Teacher &middot; Open Dates / 开放日期</div></div>
</header>
<div class="navrow"><a href="teachers.html">&larr; Teacher menu</a><button id="navlogout" type="button" onclick="try{sessionStorage.removeItem('gma_pin');sessionStorage.removeItem('gma_view_pin')}catch(e){}location.reload()">Log out</button></div>
<main class="wrap" id="app"></main>
<script>
var SUBMIT_URL = 'https://script.google.com/macros/s/AKfycbwvukSXQHKhnbMndouaYUC07qpx_2tXQWkbUTIYsrCB8gSbByjQ7u0zqkKu4RiY66E7/exec';
var LOGO_URL = 'logo.png';
var PIN = ''; try { PIN = sessionStorage.getItem('gma_pin') || ''; } catch (e) {}
var app = document.getElementById('app');
var NAMES = { TCBT: 'Trial Class + Brain Test Report 试课+领取报告', TC: 'Trial Class only 只试课', BT: 'Brain Test Report only 只领取报告' };
var T3 = ['TCBT', 'TC', 'BT'];
var ERR = { auth: 'Wrong password.', locked: 'Too many wrong passwords. Try again in 5 minutes.', disabled: 'Teacher password is not turned on yet.' };
var S = { authed: false, busy: false, err: '', msg: '', svc: 'TCBT', on: false, st: { TCBT: {}, TC: {}, BT: {} }, sv: { TCBT: {}, TC: {}, BT: {} }, extra: [], booked: { TCBT: {}, TC: {}, BT: {} }, cap: 1, month: '', moreMon: 0, dirty: 0, loaded: false };
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function api(body, cb) {
  body.pin = PIN;
  var ac = window.AbortController ? new AbortController() : null, to = setTimeout(function () { if (ac) ac.abort(); }, 25000);
  fetch(SUBMIT_URL, { method: 'POST', body: JSON.stringify(body), signal: ac ? ac.signal : undefined }).then(function (r) { return r.json(); }).then(function (j) { clearTimeout(to); cb(j); }).catch(function () { clearTimeout(to); cb(null); });
}
function errText(j) {
  if (!j) return 'Could not connect. Check the internet and try again (nothing was saved).';
  if (/^locked/.test(j.error || '')) return ERR.locked;
  if (j.error === 'booked') return 'Some times you closed already have parent bookings: ' + (j.cells || []).slice(0, 6).join('; ') + '. Please keep them open.';
  if (j.error === 'overlap') return 'These times overlap each other (not allowed): ' + (j.cells || []).slice(0, 6).join('; ');
  return ERR[j.error] || ('Error: ' + (j.error || 'unknown'));
}

/* ---- default dates & times (same rules as the parents' booking page) ---- */
var EV = ['6:45pm–8:15pm', '8:30pm–10:00pm'], DAY = ['11:00am–12:30pm', '1:30pm–3:00pm', '3:30pm–5:00pm'];
var TR = { 0: ['10:15am–11:45am', '1:30pm–3:00pm', '3:30pm–5:00pm'], 1: EV, 2: DAY, 3: EV, 4: DAY, 5: EV, 6: ['11:00am–12:30pm', '1:30pm–3:00pm', '3:30pm–5:00pm', '5:15pm–6:45pm'] };
var HOURLY = []; for (var h = 10; h < 22; h++) { var a = h < 12 ? 'am' : 'pm', x = h % 12 || 12; HOURLY.push(x + ':00' + a + '–' + x + ':45' + a); }
var DAYS = [], DEF = { BT: {}, TC: {} }, BASE = { TCBT: [], TC: [], BT: HOURLY.slice() };
function mn(l) { var m = String(l).match(/^(\d+):(\d+)\s*(am|pm)/i); if (!m) return 0; return ((+m[1] % 12) + (m[3].toLowerCase() === 'pm' ? 12 : 0)) * 60 + (+m[2]); }
function win(svc, l) { var m = String(l).match(/(\d+):(\d+)\s*(am|pm)\s*[–-]\s*(\d+):(\d+)\s*(am|pm)/i); if (!m) return null; var s = mn(m[1] + ':' + m[2] + m[3]), e = mn(m[4] + ':' + m[5] + m[6]); return [s, svc === 'BT' ? s + 60 : e]; }
(function () {
  var t = new Date(Date.now() + 8 * 3600000), y = t.getUTCFullYear(), mo = t.getUTCMonth(), dd = t.getUTCDate();
  for (var i = 0; i < 760; i++) {
    var d = new Date(Date.UTC(y, mo, dd + i)), w = d.getUTCDay(), k = d.toISOString().slice(0, 10);
    DAYS.push({ k: k, w: w, d: d.getUTCDate(), m: d.getUTCMonth() + 1, mk: k.slice(0, 7), i: i });
    if ((k >= '2026-11-27' && k <= '2026-11-29') || k >= '2026-12-04') DEF.TC[k] = TR[w];
    if (k <= '2026-12-24') DEF.BT[k] = w === 0 ? HOURLY.slice(2) : w === 6 ? HOURLY.slice(0, 1) : w === 5 ? HOURLY.slice(0, 8) : HOURLY;
  }
  var seen = {}; for (var w2 in TR) TR[w2].forEach(function (l) { seen[l] = 1; });
  BASE.TC = Object.keys(seen).sort(function (a, b) { return mn(a) - mn(b); }); BASE.TCBT = BASE.TC.slice();
})();
var ROWS = { TCBT: [], TC: [], BT: [] };
var WD = ['S', 'M', 'T', 'W', 'T', 'F', 'S'];
function inGrid(k) { return k >= DAYS[0].k && k <= DAYS[DAYS.length - 1].k; }
function key(k, l) { return k + '|' + l; }
function bkd(svc, k, l) { return S.booked[svc][key(k, l)] || 0; }
function capOf(svc, k, l) { return S.st[svc][key(k, l)] || 0; }
function overlap(a, b) { return a && b && a[0] < b[1] && b[0] < a[1]; }
function buildRows() {
  T3.forEach(function (svc) {
    var seen = {}, L = BASE[svc].slice(); L.forEach(function (l) { seen[l] = 1; });
    [S.booked[svc]].forEach(function (m) { for (var kk in m) { var p = kk.split('|'); if (inGrid(p[0]) && !seen[p[1]]) { seen[p[1]] = 1; L.push(p[1]); } } });
    L.sort(function (a, b) { return mn(a) - mn(b); }); ROWS[svc] = L;
  });
}
function applyOpen(svc, k, l, n) {   // the three tables may all be open at the same time; the first booking closes the other kinds at that time
  if (blockedBy(svc, k, l) && !(capOf(svc, k, l) > 0)) return 'blocked';
  S.st[svc][key(k, l)] = n; return 0;
}
function blockedBy(svc, k, l) {   // an existing booking in another table overlaps this time: cannot be opened
  if (bkd(svc, k, l) > 0) return null;
  var w = win(svc, l), r = null;
  T3.forEach(function (o) { if (o === svc) return; ROWS[o].forEach(function (l2) { if (!r && bkd(o, k, l2) > 0 && overlap(w, win(o, l2)) && !sameFam(o, k, l2, svc, l)) r = o + ' ' + l2; }); });
  return r;
}
function seed() {
  T3.forEach(function (svc) { S.st[svc] = {}; });
  DAYS.forEach(function (dy) {
    T3.forEach(function (svc) { ROWS[svc].forEach(function (l) { var b = bkd(svc, dy.k, l); if (b > 0) S.st[svc][key(dy.k, l)] = (svc === 'TC' ? b : 1); }); });
    if (dy.i >= 60) return;   // first-time suggestion covers the next 60 days only
    (DEF.TC[dy.k] || []).forEach(function (l) { ['TCBT', 'TC'].forEach(function (t) { if (!(capOf(t, dy.k, l) > 0)) S.st[t][key(dy.k, l)] = 1; }); });
    (DEF.BT[dy.k] || []).forEach(function (l) { if (!(capOf('BT', dy.k, l) > 0)) S.st.BT[key(dy.k, l)] = 1; });
  });
  S.extra = [];
  T3.forEach(function (svc) { for (var kk in S.booked[svc]) { var p = kk.split('|'); if (!inGrid(p[0]) && p[0] >= DAYS[0].k) S.extra.push([svc, p[0], p[1], svc === 'TC' ? Math.max(1, S.booked[svc][kk]) : 1]); } });
  S.sv = { TCBT: {}, TC: {}, BT: {} };
}
function loadAvail(a) {
  S.extra = []; S.sv = { TCBT: {}, TC: {}, BT: {} }; S.on = !!(a && a.on);
  if (!S.on) { buildRows(); seed(); return; }
  T3.forEach(function (svc) { S.st[svc] = {}; for (var k in (a[svc] || {})) for (var l in a[svc][k]) {
    if (inGrid(k)) { S.st[svc][key(k, l)] = a[svc][k][l]; if (ROWS[svc].indexOf(l) < 0 && BASE[svc].indexOf(l) < 0) BASE[svc].push(l); }
    else S.extra.push([svc, k, l, a[svc][k][l]]);
  } });
  buildRows();
  T3.forEach(function (svc) { S.sv[svc] = {}; for (var kk in S.st[svc]) S.sv[svc][kk] = S.st[svc][kk]; });
}
function countDirty() {
  var n = 0; T3.forEach(function (svc) { DAYS.forEach(function (dy) { ROWS[svc].forEach(function (l) { if ((S.st[svc][key(dy.k, l)] || 0) !== (S.sv[svc][key(dy.k, l)] || 0)) n++; }); }); });
  S.dirty = n; return n;
}
function locked(svc, k, l) { return bkd(svc, k, l) > 0; }
S.refs = { TCBT: {}, TC: {}, BT: {} };
function loadRefs(cb) {   // which bookings sit in each time, so the same family's own trial + report are not treated as a clash
  fetch(SUBMIT_URL + '?action=booked').then(function (r) { return r.json(); }).then(function (j) {
    var R = { TCBT: {}, TC: {}, BT: {} };
    for (var k in (j.trial || {})) String(j.trial[k]).split(',').filter(Boolean).forEach(function (r) { (R[/^TB/.test(r) ? 'TCBT' : 'TC'][k] = R[/^TB/.test(r) ? 'TCBT' : 'TC'][k] || []).push(r); });
    for (var k2 in (j.report || {})) String(j.report[k2]).split(',').filter(Boolean).forEach(function (r) { (R.BT[k2] = R.BT[k2] || []).push(r); });
    S.refs = R; cb();
  }).catch(function () { cb(); });
}
function sameFam(a, k, la, b, lb) { var x = S.refs[a][key(k, la)] || [], y = S.refs[b][key(k, lb)] || []; return x.some(function (r) { return y.indexOf(r) > -1; }); }
function clashes() {   // red: more parents than allowed, or a booked time overlapping another booked time (old bookings)
  var red = {}, n = 0;
  DAYS.forEach(function (dy) {
    var L = []; T3.forEach(function (svc) { ROWS[svc].forEach(function (l) { var b = bkd(svc, dy.k, l); if (b > 0) { L.push([svc, l, win(svc, l)]); if (b > Math.max(1, capOf(svc, dy.k, l))) { red[svc + '|' + key(dy.k, l)] = 1; } } }); });
    for (var i = 0; i < L.length; i++) for (var j = i + 1; j < L.length; j++) if (overlap(L[i][2], L[j][2]) && !sameFam(L[i][0], dy.k, L[i][1], L[j][0], L[j][1])) { red[L[i][0] + '|' + key(dy.k, L[i][1])] = 1; red[L[j][0] + '|' + key(dy.k, L[j][1])] = 1; }
  });
  for (var q in red) n++; S.clashN = n; return red;
}

function render() {
  var h = '';
  if (!S.authed) {
    var cur = document.getElementById('pin'), had = cur && document.activeElement === cur, val = cur ? cur.value : PIN;
    h += '<div class="card" style="max-width:460px;margin:0 auto"><h2>Teacher login</h2><label>Password</label><input type="password" id="pin" autocomplete="current-password" value="' + esc(val) + '">';
    if (S.err) h += '<div class="err">' + esc(S.err) + '</div>';
    h += '<button class="btn pri" id="login"' + (S.busy ? ' disabled' : '') + '>' + (S.busy ? 'Please wait...' : 'Log in') + '</button></div>';
    app.innerHTML = h; if (had) { var ni = document.getElementById('pin'); ni.focus(); try { ni.setSelectionRange(val.length, val.length); } catch (x) {} } return;
  }
  var svc = S.svc, red = clashes();
  h += '<div class="card"><h2>Open dates &amp; times 开放日期与时段</h2><p class="hint">Tap a box to open or close one time. Tap a date at the top to open or close the whole day. Parents only see the times that are open. The three tables can all be set for the same time. When the first booking comes in, the other two kinds are closed at that time automatically (the lock icon). Only Trial Class only can take more parents (up to 5); the other two take exactly 1. 点格子开关单个时段，点上方日期开关整天。三个表可以设同一个时间；一旦有人先预约，其他两种在该时间会自动关闭（锁）。只有「只试课」可以接多位（最多5位），其他两种固定1位。</p>';
  if (!S.on) h += '<div class="err" style="background:#fff4d6;color:#8a5a00">Not switched on yet. Parents still see the old dates until you press Save once. Please choose which times are for each table first. 还没启用，家长目前看到的仍是旧日期；请先设定好再按保存。</div>';
  h += '<div class="tabs">' + T3.map(function (t) { return '<button data-svc="' + t + '" class="' + (svc === t ? 'on' : '') + '">' + NAMES[t] + '</button>'; }).join('') + '</div>';
  h += '<div class="legend"><span><em class="lg" style="background:#fff">2</em> Open (number = parents allowed) 开放（数字=可接家长数）</span><span><em class="lg" style="background:#d9f2d4"></em> Closed 关闭</span><span><em class="lg" style="background:#fff4d6;outline:2px solid #f0b429;outline-offset:-2px">1</em> Has booking 已有预约（不能关闭）</span><span><em class="lg" style="background:repeating-linear-gradient(45deg,#e4e4e4,#e4e4e4 4px,#f2f2f2 4px,#f2f2f2 8px)">&#128274;</em> Closed by an earlier booking of another kind 已被其他种类的预约占用（锁）</span><span><em class="lg" style="background:#fbd0d0;outline:2px solid #d33;outline-offset:-2px">!</em> Clash 冲突</span><span><em class="lg" style="box-shadow:inset 0 0 0 3px #fb5f3b;background:#fff"></em> Changed 已改未保存</span></div>';
  if (svc === 'TC') h += '<div class="hint" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">Parents per time when opening 开放时每个时段可接几位家长（1-5）: <select id="capsel">' + [1, 2, 3, 4, 5].map(function (n) { return '<option value="' + n + '"' + (S.cap === n ? ' selected' : '') + '>' + n + '</option>'; }).join('') + '</select> (tap a closed box to open it; tap an open box with a different number to change it, with the same number to close it 点空格=开放；点已开放且数字不同的格子=改人数；数字相同=关闭)</div>';
  if (S.err) h += '<div class="err">' + esc(S.err) + '</div>';
  if (S.msg) h += '<div class="okm">' + esc(S.msg) + '</div>';
  var MN = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'], months = [];
  DAYS.forEach(function (dy) { if (months.indexOf(dy.mk) < 0) months.push(dy.mk); });
  var used = {}; T3.forEach(function (sv) { for (var kk in S.st[sv]) if (S.st[sv][kk] > 0) used[kk.slice(0, 7)] = 1; for (var k2 in S.booked[sv]) used[k2.slice(0, 7)] = 1; });
  var allM = months, nShow = 7 + S.moreMon;   // this month + the next 6 months, then any month you add, plus every month that already has open times
  months = allM.filter(function (m, i) { return i < nShow || used[m]; });
  if (months.indexOf(S.month) < 0) S.month = months[0];
  var canMore = allM.length > months.length && allM.indexOf(months[months.length - 1]) < allM.length - 1;
  h += '<div class="tabs" style="margin-top:0">' + months.map(function (m) { return '<button data-mon="' + m + '" class="' + (S.month === m ? 'on' : '') + '" style="padding:6px 12px">' + MN[+m.slice(5) - 1] + ' ' + m.slice(0, 4) + '</button>'; }).join('') + (canMore && nShow < 24 ? '<button id="moremon" style="padding:6px 12px">+ 1 month 再加一个月</button>' : '') + '</div>';
  var VD = DAYS.filter(function (dy) { return dy.mk === S.month; });
  h += '<div class="gridbox"><table class="g"><thead><tr><th class="corner">Time 时段</th>';
  VD.forEach(function (dy) { h += '<th data-day="' + dy.k + '" class="' + (dy.w === 0 || dy.w === 6 ? 'we' : '') + '">' + WD[dy.w] + '<small>' + dy.d + '/' + dy.m + '</small></th>'; });
  h += '</tr></thead><tbody>';
  ROWS[svc].forEach(function (l, ri) {
    h += '<tr><th>' + (ri + 1) + '&nbsp;&nbsp;' + esc(l) + '</th>';
    VD.forEach(function (dy) {
      var c = capOf(svc, dy.k, l), b = bkd(svc, dy.k, l), diff = c !== (S.sv[svc][key(dy.k, l)] || 0), rd = red[svc + '|' + key(dy.k, l)];
      var bl = blockedBy(svc, dy.k, l);
      var cls = 'c ' + (rd ? 'bad' : b > 0 ? 'lock' : c > 0 ? 'open' : bl ? 'blk' : 'closed') + (diff ? ' chg' : '');
      var tx = b > 0 ? b + '/' + c : (c > 0 ? c : '');
      h += '<td class="' + cls + '" data-k="' + dy.k + '" data-l="' + esc(l) + '"' + (bl ? ' title="Blocked by an existing booking: ' + esc(bl) + '"' : '') + '>' + (bl ? '&#128274;' + (c > 0 ? c : '') : tx) + '</td>';
    });
    h += '</tr>';
  });
  h += '</tbody></table></div>';
  if (S.clashN) h += '<div class="err">' + S.clashN + ' clash(es) shown in red: old bookings that overlap each other or have too many parents. Nothing was changed automatically. 红色 = 旧预约互相重叠或人数超过上限；系统没有自动改动任何预约。</div>';
  if (svc === 'TCBT') h += '<p class="hint">Always 1 parent per time (the Brain Test report is private). 每个时段固定只接 1 位家长（报告涉及隐私）。</p>';
  else if (svc === 'BT') h += '<p class="hint">Always 1 parent per time. Each collection uses 1 hour with the same consultant, so it cannot overlap a Trial Class. 每个时段固定 1 位家长，每次1小时，同一位顾问，不能和试课重叠。</p>';
  h += '</div>';
  countDirty();
  var canSave = (S.dirty || !S.on) && !S.busy;
  h += '<div class="bar"><div class="grow">' + (S.dirty ? S.dirty + ' change(s) not saved yet 项改动未保存' : S.on ? 'No unsaved changes 没有未保存的改动' : 'Review, then press Save to switch on 检查后按保存启用') + '</div><button class="btn sec2" id="reset"' + (S.dirty && !S.busy ? '' : ' disabled') + '>Undo 撤销</button><button class="btn pri" id="save"' + (canSave ? '' : ' disabled') + '>' + (S.busy ? 'Saving...' : 'Save 保存') + '</button></div>';
  var keep = document.querySelector('.gridbox'), sl = keep ? keep.scrollLeft : 0, stp = keep ? keep.scrollTop : 0;
  app.innerHTML = h;
  var nb = document.querySelector('.gridbox'); if (nb) { nb.scrollLeft = sl; nb.scrollTop = stp; }
}
function setMsg(e, m) { S.err = e || ''; S.msg = m || ''; }
function toggleCell(svc, k, l) {
  var bb = blockedBy(svc, k, l); if (bb && !(capOf(svc, k, l) > 0)) { setMsg('Locked: another kind of booking already sits at this time (' + bb + '). 已被其他种类的预约占用（' + bb + '），暂时不能开放。'); return false; }
  var c = capOf(svc, k, l), b = bkd(svc, k, l), want = svc === 'TC' ? S.cap : 1;
  if (c > 0 && (svc !== 'TC' || c === want)) {   // close
    if (b > 0) { setMsg('This time already has a booking, so it cannot be closed. 这个时段已有预约，不能关闭。'); return false; }
    S.st[svc][key(k, l)] = 0; setMsg(); return true;
  }
  if (c > 0 && want < b) { setMsg('There are already ' + b + ' parents booked here. 这个时段已有 ' + b + ' 位家长预约。'); return false; }
  var r = applyOpen(svc, k, l, want);
  if (r === 'blocked') { setMsg('Locked: another kind of booking already sits at this time. 已被其他种类的预约占用，不能开放。'); return false; }
  setMsg('', r ? r + ' overlapping time(s) in other tables were closed automatically. 已自动关闭 ' + r + ' 个重叠时段。' : ''); return true;
}
function toggleDay(svc, k) {
  var free = ROWS[svc].filter(function (l) { return !locked(svc, k, l); });
  var anyOpen = free.some(function (l) { return capOf(svc, k, l) > 0; });
  if (anyOpen) { free.forEach(function (l) { S.st[svc][key(k, l)] = 0; }); setMsg(); return; }
  var dw = DAYS.filter(function (d) { return d.k === k; })[0].w, L = svc === 'BT' ? HOURLY : TR[dw], n = 0, blocked = 0;
  L.forEach(function (l) { if (ROWS[svc].indexOf(l) < 0) return; var r = applyOpen(svc, k, l, svc === 'TC' ? S.cap : 1); if (r === 'blocked') blocked++; else n += r; });
  setMsg(blocked ? blocked + ' time(s) skipped because of existing bookings. 有 ' + blocked + ' 个时段因已有预约而跳过。' : '', n ? n + ' overlapping time(s) in other tables were closed automatically. 已自动关闭 ' + n + ' 个重叠时段。' : '');
}
function rowsToSave() {
  var rows = [];
  T3.forEach(function (svc) { DAYS.forEach(function (dy) { ROWS[svc].forEach(function (l) { var c = capOf(svc, dy.k, l); if (c > 0) rows.push([svc, dy.k, l, c]); }); }); });
  S.extra.forEach(function (r) { rows.push(r); });
  return rows;
}
function take(j) { loadAvail(j.avail); }
function setBooked(j) { if (j && j.booked) S.booked = { TCBT: j.booked.TCBT || {}, TC: j.booked.TC || {}, BT: j.booked.BT || {} }; }
function load() {
  S.busy = true; S.err = ''; render();
  api({ action: 'staff_avail' }, function (j) {
    if (j && j.ok) { S.authed = true; try { sessionStorage.setItem('gma_pin', PIN); } catch (x) {} setBooked(j); buildRows(); take(j); loadRefs(function () { S.busy = false; S.loaded = true; render(); }); }
    else { S.busy = false; S.authed = false; try { sessionStorage.removeItem('gma_pin'); } catch (x) {} S.err = (PIN || j) ? errText(j) : ''; render(); }
  });
}
document.addEventListener('change', function (e) { if (e.target.id === 'capsel') { S.cap = +e.target.value; } });
document.addEventListener('click', function (e) {
  var t = e.target;
  var td = t.closest && t.closest('td.c'); if (td && S.authed) { toggleCell(S.svc, td.dataset.k, td.dataset.l); render(); return; }
  var th = t.closest && t.closest('th[data-day]'); if (th && S.authed) { toggleDay(S.svc, th.dataset.day); render(); return; }
  var el = t.closest && t.closest('button'); if (!el) return;
  if (el.id === 'login') { PIN = document.getElementById('pin').value; load(); }
  else if (el.id === 'moremon') { S.moreMon++; render(); }
  else if (el.dataset.mon) { S.month = el.dataset.mon; S.err = ''; S.msg = ''; render(); }
  else if (el.dataset.svc) { S.svc = el.dataset.svc; S.err = ''; S.msg = ''; render(); }
  else if (el.id === 'reset') { T3.forEach(function (svc) { S.st[svc] = {}; for (var kk in S.sv[svc]) S.st[svc][kk] = S.sv[svc][kk]; }); S.err = ''; S.msg = ''; render(); }
  else if (el.id === 'save') {
    S.busy = true; S.err = ''; S.msg = ''; render();
    api({ action: 'staff_avail_save', rows: rowsToSave() }, function (j) {
      S.busy = false;
      if (j && j.ok) { setBooked(j); take(j); S.msg = 'Saved. Parents see the new dates now. 已保存，家长现在看到的是新的日期。'; render(); } else { S.err = errText(j); render(); }
    });
  }
});
window.addEventListener('beforeunload', function (e) { if (S.authed && S.dirty) { e.preventDefault(); e.returnValue = ''; } });
document.addEventListener('keydown', function (e) { if (e.key === 'Enter' && e.target.id === 'pin') document.getElementById('login').click(); });
if (LOGO_URL) { var lg = document.getElementById('logo'), im = new Image(); im.className = 'brandlogo'; im.alt = ''; im.src = LOGO_URL; im.onload = function () { lg.replaceWith(im); }; }
if (PIN) load(); else render();
</script>
