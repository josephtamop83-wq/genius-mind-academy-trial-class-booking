<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>GMA Staff - Lucky Draw</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
.wrap{max-width:640px;margin:0 auto;padding:16px 16px 60px}
.stock{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.stock span{background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:700}
.stock span.low{border-color:var(--bad);color:var(--bad)}
.pz{display:grid;grid-template-columns:1fr;gap:8px;margin-top:8px}
.pz button{padding:12px;border-radius:12px;border:1.5px solid var(--tint-line);background:var(--tint);font:inherit;font-weight:800;cursor:pointer;text-align:left}
.pz button:disabled{opacity:.4;cursor:not-allowed}
.pz button.none{background:#fff;border-color:var(--line);font-weight:600}
.rc{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;padding:10px 12px;margin-top:8px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font:inherit;text-align:left;cursor:pointer}
.rc.wait{background:#fff3e6;border-color:#f0b27a}
.rc b{display:block}.rc .st{font-weight:800;font-size:.85em;white-space:nowrap}.rc.wait .st{color:#b45309}.rc.done .st{color:#6b7280}
.rch{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px}.rch select{padding:6px;border-radius:8px;border:1.5px solid var(--line);font:inherit}
.won{display:inline-block;background:#e8f5d4;color:#3d6b10;border-radius:10px;padding:6px 10px;font-weight:800;margin-top:6px}
.code{font-family:monospace;font-weight:800;color:var(--plum)}
.err{background:#fde8ea;color:var(--bad);border-radius:12px;padding:10px 12px;margin:10px 0;font-weight:700}
.okm{background:#e8f5d4;color:#3d6b10;border-radius:12px;padding:10px 12px;margin:10px 0;font-weight:700}
.row2{display:flex;gap:8px}.row2>*{flex:1}
.small{font-size:12px;color:var(--muted)}
.btn{cursor:pointer}
.navrow{max-width:640px;margin:8px auto 0;padding:0 14px;display:flex;gap:8px;align-items:center}
.navrow a,.navrow button{padding:8px 13px;border-radius:999px;border:1.5px solid #ddd;background:#fff;color:inherit;font:inherit;font-weight:800;font-size:13.5px;text-decoration:none;cursor:pointer;white-space:nowrap}
.navrow button{margin-left:auto}
.stock{gap:6px;margin:8px 0}.stock span{font-size:12px;padding:4px 9px}
#fsave,#login,#find{min-height:44px}#fsave{width:100%}
@media(max-width:520px){.wrap{padding:10px 12px 40px}.card{padding:14px}.rc{padding:10px}}
</style>
</head>
<body>
<header class="top">
<div class="logo" id="logo"></div>
<div><div class="t1">Genius Mind <b>Academy</b></div><div class="t2">Staff · Lucky draw</div></div>
</header>
<div class="navrow"><a href="teachers.html">&larr; Teacher menu</a><a href="https://docs.google.com/spreadsheets/d/1innYlrTnOavDg_Db0zRkqg0m8mY-N9DBTKJ0-TNFRrw/edit" target="_blank" rel="noopener">📊 Sheet</a><button id="navlogout" type="button" onclick="try{sessionStorage.removeItem('gma_pin');sessionStorage.removeItem('gma_view_pin')}catch(e){}location.reload()">Log out</button></div>
<main class="wrap" id="app"></main>
<script>
var SUBMIT_URL = 'https://script.google.com/macros/s/AKfycbwvukSXQHKhnbMndouaYUC07qpx_2tXQWkbUTIYsrCB8gSbByjQ7u0zqkKu4RiY66E7/exec';   // same Google Apps Script web app URL as index.html
var LOGO_URL = 'logo.png';

var PIN = '';
try { PIN = sessionStorage.getItem('gma_pin') || ''; } catch (e) {}
var app = document.getElementById('app');
var S = { authed: false, msg: '', err: '', phone: '', data: null, stock: [], prizes: [], busy: false, walk: false, kids: [{ name: '', gender: '', age: '' }], parent: '' };

var ERR = { auth: 'Wrong password.', locked: 'Too many wrong passwords. Try again in 5 minutes.', disabled: 'Staff page is not turned on yet (set STAFF_PIN in the Google script).',
  nospins: 'No spins left for this number.', used: 'This prize has already been used or collected, so it cannot be changed.', same: 'That is already the recorded prize.', childdone: 'This child already spun.', outofstock: 'This prize is out of stock.', notfound: 'Not found.',
  already: 'This prize was already collected.', cancelled: 'This prize was cancelled.', missing: 'Please fill in the parent name and at least one child.', badprize: 'Unknown prize.' };

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function api(body, cb) {
  if (!SUBMIT_URL) { cb({ ok: false, error: 'nourl' }); return; }
  body.pin = PIN;
  var tries = 0;
  (function go() {
    tries++;
    var ac = window.AbortController ? new AbortController() : null, to = setTimeout(function () { if (ac) ac.abort(); }, 20000);
    fetch(SUBMIT_URL, { method: 'POST', body: JSON.stringify(body), signal: ac ? ac.signal : undefined }).then(function (r) { return r.json(); }).then(function (j) { clearTimeout(to); cb(j); }).catch(function () {
      clearTimeout(to);
      if (tries < 3) go(); else cb(null);
    });
  })();
}
var LOCK_UNTIL = 0, lockTimer = null;
function lockMsg() { var s = Math.max(0, Math.ceil((LOCK_UNTIL - Date.now()) / 1000)); return 'Too many wrong passwords. Try again in ' + Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2) + '.'; }
function startLock(sec) { LOCK_UNTIL = Date.now() + sec * 1000; clearInterval(lockTimer); lockTimer = setInterval(function () { if (Date.now() >= LOCK_UNTIL) { clearInterval(lockTimer); S.err = ''; render(); return; } var e = document.querySelector('.err'); if (e) e.textContent = lockMsg(); }, 1000); }
document.addEventListener('click', function (e) { if (e.target.closest && e.target.closest('#login') && Date.now() < LOCK_UNTIL) { e.stopImmediatePropagation(); e.preventDefault(); } }, true);   // while locked, extra tries do nothing and do not restart the timer
function errText(j) { if (j && /^locked/.test(j.error || '')) { startLock(parseInt((j.error.split(':')[1] || 300), 10) || 300); return lockMsg(); } return !j ? 'Could not connect. Check the internet and try again.' : j.error === 'nourl' ? 'SUBMIT_URL is not set in staff.html yet.' : (ERR[j.error] || ('Error: ' + j.error)); }

function render() {
  var h = '';
  if (!S.authed) {
    h = '<div class="card"><div class="sec" style="margin-top:0">Teacher login</div><label class="f">Password</label><input type="password" id="pin" autocomplete="off" value="' + esc(PIN) + '"><button class="btn pri" id="login" style="margin-top:12px">' + (S.busy ? 'Checking…' : 'Log in') + '</button>' + (S.err ? '<div class="err">' + esc(S.err) + '</div>' : '') + '</div>';
    app.innerHTML = h; return;
  }
  h += '<div class="stock">' + S.stock.filter(function (s) { return s.key !== 'NONE'; }).map(function (s) {
    var left = s.left === null ? '∞' : s.left;
    return '<span class="' + (s.left !== null && s.left <= 2 ? 'low' : '') + '">' + esc(s.name) + ': given ' + s.given + (s.stock > 0 ? ', left ' + left : '') + '</span>';
  }).join('') + '</div>';
  h += '<div class="card"><label class="f">Parent mobile number</label><div class="row2"><input type="tel" id="phone" placeholder="e.g. 012-3456789" value="' + esc(S.phone) + '"><button class="btn pri" id="find" style="flex:0 0 110px">' + (S.busy ? '…' : 'Find') + '</button></div></div>';
  if (S.msg) h += '<div class="okm">' + esc(S.msg) + '</div>';
  if (S.err) h += '<div class="err">' + esc(S.err) + '</div>';
  if (S.walk) h += walkView(); else if (S.data) h += custView();
  h += '<div class="card" id="recentcard"><div class="sec" style="margin-top:0">Recent registrations</div>' + recentCtl() + '<div id="recent">' + recentHtml() + '</div></div>';
  h += '<div style="text-align:center;margin-top:14px"><button class="btn sec2" id="logout" style="max-width:200px">Log out</button></div>';
  app.innerHTML = h;
}

var RN = 20, RW = false;
try { RN = +localStorage.getItem('gma_rn') || 20; RW = localStorage.getItem('gma_rw') === '1'; } catch (x) {}
function recentCtl() {
  return '<div class="rch"><label class="small">Show <select id="rn">' + [20, 30, 40, 50].map(function (n) { return '<option' + (n === RN ? ' selected' : '') + '>' + n + '</option>'; }).join('') + '</select></label>' +
    '<label class="small"><input type="checkbox" id="rw"' + (RW ? ' checked' : '') + '> Waiting to spin only</label>' +
    '<button class="btn sec2" id="rrefresh" style="max-width:110px;padding:6px 10px">Refresh</button></div>';
}
function recentHtml() {
  if (!S.all) return '<div class="small">Type a number above to find a customer.</div>';
  var list = Object.keys(S.all).map(function (k) { return { k: k, c: S.all[k] }; }).filter(function (x) { return x.c.found && x.c.children && x.c.children.length; });
  list.sort(function (a, b) { return (b.c.reg || 0) - (a.c.reg || 0); });
  if (RW) list = list.filter(function (x) { return !x.c.spinsUsed; });
  list = list.slice(0, RN);
  if (!list.length) return '<div class="small">' + (RW ? 'No one is waiting to spin.' : 'No registrations yet.') + '</div>';
  return list.map(function (x) {
    var c = x.c, sp = (c.spins || [])[0], t = c.reg ? new Date(c.reg).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) : '';
    var st = !c.spinsUsed ? 'Waiting to spin' : (sp && sp.key !== 'NONE' ? 'Won: ' + sp.name.replace(/ \(RM\d+\)/, '') : 'No prize');
    return '<button class="rc ' + (!c.spinsUsed ? 'wait' : 'done') + '" data-open="' + esc(x.k) + '"><span><b>' + esc(c.parent || '') + '</b><span class="small">' + esc(x.k.replace(/^60/, '0')) + (c.follow && c.follow.teacher ? ' · 👩‍🏫 ' + esc(c.follow.teacher) : '') + ' · ' + c.children.length + ' child' + (c.children.length > 1 ? 'ren' : '') + (t ? ' · ' + t : '') + '</span></span><span class="st">' + esc(st) + '</span></button>';
  }).join('');
}
function repaintRecent() { var r = document.getElementById('recent'); if (r) r.innerHTML = recentHtml(); }
document.addEventListener('change', function (e) {
  if (e.target.id === 'rn') { RN = +e.target.value; try { localStorage.setItem('gma_rn', RN); } catch (x) {} repaintRecent(); }
  if (e.target.id === 'rw') { RW = e.target.checked; try { localStorage.setItem('gma_rw', RW ? '1' : '0'); } catch (x) {} repaintRecent(); }
});

function followCard(d) {
  var f = d.follow || {}, T = (S.teachers || d.teachers || []).filter(function (t) { return t.name; }), ST = S.statuses || d.statuses || ['Not contacted', 'Contacted', 'Interested', 'Joined', 'Not interested'];
  if (!T.length) return '<div class="card"><div class="sec" style="margin-top:0">Follow-up teacher</div><div class="small">No teachers set up yet. Add them in the Teacher menu &rarr; [6] Settings.</div></div>';
  var h = '<div class="card"><div class="sec" style="margin-top:0">Follow-up teacher</div>';
  if (f.teacher) h += '<div class="won">' + esc(f.teacher) + (f.tphone ? ' · ' + esc(f.tphone.replace(/^60/, '0')) : '') + '</div>';
  h += '<label class="f">I will follow up this family (pick your name)</label><select id="fteacher" style="width:100%;padding:10px;border-radius:10px;border:1.5px solid var(--line);font:inherit"><option value="0">— not assigned —</option>' + T.map(function (t) { return '<option value="' + t.n + '"' + (t.name === f.teacher ? ' selected' : '') + '>' + t.n + '. ' + esc(t.name) + '</option>'; }).join('') + '</select>';
  h += '<label class="f">Status</label><select id="fstatus" style="width:100%;padding:10px;border-radius:10px;border:1.5px solid var(--line);font:inherit">' + ST.map(function (x) { return '<option' + (x === (f.status || 'Not contacted') ? ' selected' : '') + '>' + esc(x) + '</option>'; }).join('') + '</select>';
  h += '<label class="f">Note</label><textarea id="fnote" rows="2" style="width:100%;padding:10px;border-radius:10px;border:1.5px solid var(--line);font:inherit" placeholder="e.g. call back Saturday">' + esc(f.note || '') + '</textarea>';
  h += '<button class="btn pri" id="fsave" style="margin-top:8px">Save follow-up</button></div>';
  return h;
}
function custView() {
  var d = S.data, left = 1 - (d.spinsUsed ? 1 : 0);
  var h = '<div class="card"><div class="sec" style="margin-top:0">' + esc(d.parent || '') + ' · ' + esc(S.phone) + '</div>';
  h += '<div class="small">Spins used ' + (d.spinsUsed || 0) + ' of ' + (d.spinsAllowed || 0) + (left <= 0 ? ' - no spins left' : '') + '</div></div>';
  h += followCard(d);
  var kids = d.children || [];
  h += '<div class="card"><div class="sec" style="margin-top:0">Children</div><div class="small">' + kids.map(function (c) { return esc(c.name) + ' (' + (c.gender === 'M' ? 'Male' : 'Female') + ', ' + esc(c.age) + ')'; }).join(' · ') + '</div></div>';
  var sps = d.spins || [];
  var pzBtns = function () {
    return '<div class="pz">' + (d.prizeList || []).map(function (p) {
      var st = (d.stock || []).filter(function (x) { return x.key === p.key; })[0];
      var out = st && st.stock > 0 && st.left <= 0;
      return '<button data-spin="0" data-prize="' + esc(p.key) + '"' + (out ? ' disabled' : '') + '>' + esc(p.name) + (out ? ' (out of stock)' : '') + '</button>';
    }).join('') + '</div>';
  };
  if (sps.length) {
    var locked = sps.some(function (sp) { return sp.status !== 'Won' || sp.ref; });
    h += '<div class="card"><div class="sec" style="margin-top:0">Prize won</div><div class="won">' + (sps[0].key === 'NONE' ? 'No prize' : '🎁 ' + esc(sps[0].name)) + '</div><div class="small">One spin per registration. The same prize applies to every child.</div>';
    sps.forEach(function (sp) { if (sp.code) h += '<div class="small">' + esc(sp.child) + ': <span class="code">' + esc(sp.code) + '</span> · ' + esc(sp.status) + (sp.ref ? ' · booked ' + esc(sp.ref) : '') + '</div>'; });
    if (locked) h += '<div class="small" style="margin-top:8px">Already booked or collected - the prize can no longer be changed.</div>';
    else if (S.changing) h += '<div class="small" style="margin-top:10px"><b>Choose the correct prize:</b></div>' + pzBtns() + '<button class="btn sec2" id="cancelchg" style="max-width:160px;margin-top:8px">Cancel</button>';
    else h += '<button class="btn sec2" id="chgprize" style="max-width:200px;margin-top:10px">Change prize</button>';
    h += '</div>';
  } else {
    h += '<div class="card"><div class="sec" style="margin-top:0">What did the family win?</div><div class="small">One spin per registration. Free Trial Class / Brain Test Report applies to every child.</div><div class="pz">' + (d.prizeList || []).map(function (p) {
      var st = (d.stock || []).filter(function (x) { return x.key === p.key; })[0];
      var out = st && st.stock > 0 && st.left <= 0;
      return '<button data-spin="0" data-prize="' + esc(p.key) + '" class="' + (p.key === 'NONE' ? 'none' : '') + '"' + (out ? ' disabled' : '') + '>' + esc(p.name) + (out ? ' (out of stock)' : '') + '</button>';
    }).join('') + '</div></div>';
  }
  if ((d.bookings || []).length) h += '<div class="card"><div class="sec" style="margin-top:0">Bookings</div>' + d.bookings.map(function (b) {
    var isBT = b.service === 'BT', dt = isBT ? b.reportDate : b.date, sl = isBT ? b.reportSlot : b.slot;
    var x = '<div class="small" style="margin-top:8px"><b>' + esc(b.ref) + '</b> · ' + esc(dt) + ' ' + esc(sl) + (b.reportSlot && !isBT ? ' · report ' + esc(b.reportSlot) : '') +
      ' <span style="color:#777">(parent changes used ' + (b.changes || 0) + '/' + (b.maxChanges || 0) + ')</span></div>';
    if (S.chg === b.ref) return x + chgView(b);
    return x + '<button class="btn sec2" data-chg="' + esc(b.ref) + '" style="max-width:220px;margin-top:6px">Change date / time</button>';
  }).join('') + '</div>';
  return h;
}


// ---- teacher changes a booking's date/time (no limits) ----
var DATA = (function () {
  var EV = ['6:45pm–8:15pm', '8:30pm–10:00pm'], DAY = ['11:00am–12:30pm', '1:30pm–3:00pm', '3:30pm–5:00pm'];
  var tr = { 0: ['10:15am–11:45am', '1:30pm–3:00pm', '3:30pm–5:00pm'], 1: EV, 2: DAY, 3: EV, 4: DAY, 5: EV, 6: ['11:00am–12:30pm', '1:30pm–3:00pm', '3:30pm–5:00pm', '5:15pm–6:45pm'] };
  var Sl = []; for (var h = 10; h < 22; h++) { var a = h < 12 ? 'am' : 'pm', x = h % 12 || 12; Sl.push(x + ':00' + a + '–' + x + ':45' + a); }
  var T = {}, R = {};
  for (var i = 0; i < 39; i++) {
    var d = new Date(Date.UTC(2026, 10, 23 + i)), w = d.getUTCDay(), k = d.toISOString().slice(0, 10);
    if ((k >= '2026-11-27' && k <= '2026-11-29') || k >= '2026-12-04') T[k] = tr[w];
    if (k <= '2026-12-31') R[k] = w === 0 ? Sl.slice(2) : w === 6 ? Sl.slice(0, 1) : w === 5 ? Sl.slice(0, 8) : Sl;
  }
  return { TRIAL: T, REPORT: R };
})();
function mins(l) { var m = l.match(/(\d+):(\d+)(am|pm)/); return (parseInt(m[1], 10) % 12 + (m[3] === 'pm' ? 12 : 0)) * 60 + parseInt(m[2], 10); }
function range(l) { var p = l.split('–'); return [mins(p[0] + (/am|pm/.test(p[0]) ? '' : p[1].slice(-2))), mins(p[1])]; }
function reportFor(date, trialLabel) { var r = range(trialLabel), list = DATA.REPORT[date] || []; for (var i = 0; i < list.length; i++) { var s = mins(list[i]); if (s >= r[0] && s < r[1]) return list[i]; } return null; }
function loadTaken(cb) {
  fetch(SUBMIT_URL + '?action=booked').then(function (r) { return r.json(); }).then(function (j) { S.taken = { trial: j.trial || {}, report: j.report || {} }; cb(); }).catch(function () { S.taken = { trial: {}, report: {} }; cb(); });
}
function chgView(b) {
  var isBT = b.service === 'BT', kind = isBT ? 'report' : 'trial', table = isBT ? DATA.REPORT : DATA.TRIAL;
  var dates = Object.keys(table).sort();
  var cur = S.cd || (isBT ? b.reportDate : b.date), curSlot = S.cs;
  if (dates.indexOf(cur) < 0) cur = dates[0];
  var slots = table[cur] || [];
  var h = '<div class="card child"><label class="f">New date</label><select id="cdate">' + dates.map(function (d) { return '<option value="' + d + '"' + (d === cur ? ' selected' : '') + '>' + d + '</option>'; }).join('') + '</select>' +
    '<label class="f">New time</label><select id="cslot"><option value="">Choose…</option>' + slots.map(function (l) {
      var holder = (S.taken && S.taken[kind] || {})[cur + '|' + l], own = holder === b.ref;
      return '<option value="' + esc(l) + '"' + (holder && !own ? ' disabled' : '') + (l === curSlot ? ' selected' : '') + '>' + esc(l) + (own ? ' (current)' : holder ? ' (taken)' : '') + '</option>';
    }).join('') + '</select>';
  if (b.service === 'TCBT') {
    var rdates = Object.keys(DATA.REPORT).sort(), rd = S.rd || '', rslots = rd ? (DATA.REPORT[rd] || []) : [];
    h += '<div class="sec" style="margin-top:12px">Report collection (Brain Test)</div><label class="f">Report date</label><select id="rdate"><option value="">No report time yet</option>' + rdates.map(function (d) { return '<option value="' + d + '"' + (d === rd ? ' selected' : '') + '>' + d + '</option>'; }).join('') + '</select>';
    if (rd) h += '<label class="f">Report time</label><select id="rslot"><option value="">Choose…</option>' + rslots.map(function (l) {
      var holder = (S.taken && S.taken.report || {})[rd + '|' + l], own = holder === b.ref;
      return '<option value="' + esc(l) + '"' + (holder && !own ? ' disabled' : '') + (l === S.rs ? ' selected' : '') + '>' + esc(l) + (own ? ' (current)' : holder ? ' (taken)' : '') + '</option>';
    }).join('') + '</select>';
  }
  h += '<div class="row2" style="margin-top:10px"><button class="btn pri" data-chgsave="' + esc(b.ref) + '" data-svc="' + esc(b.service) + '">' + (S.busy ? 'Saving…' : 'Save change') + '</button><button class="btn sec2" id="chgcancel" style="flex:0 0 100px">Cancel</button></div></div>';
  return h;
}
function openChg(ref) {
  S.chg = ref; S.cd = null; S.cs = ''; S.err = ''; S.msg = '';
  var b = (S.data.bookings || []).filter(function (x) { return x.ref === ref; })[0];
  if (b) S.cs = b.service === 'BT' ? (b.reportSlot || '') : (b.slot || '');
  S.rd = b && b.service === 'TCBT' ? (b.reportDate || '') : ''; S.rs = b && b.service === 'TCBT' ? (b.reportSlot || '') : '';
  S.cd = b ? (b.service === 'BT' ? b.reportDate : b.date) : null;
  S.taken = null; render(); loadTaken(render);
}

function walkView() {
  var h = '<div class="card"><div class="sec" style="margin-top:0">New customer - register</div><div class="small">Not found. Fill in the details so the children can spin.</div>' +
    '<label class="f">Parent name *</label><input type="text" data-p="parent" value="' + esc(S.parent) + '">';
  S.kids.forEach(function (c, i) {
    h += '<div class="card child"><h4>Child ' + (i + 1) + '</h4><label class="f">Name</label><input type="text" data-k="name" data-i="' + i + '" value="' + esc(c.name) + '">' +
      '<div class="grid2"><div><label class="f">Gender</label><select data-k="gender" data-i="' + i + '"><option value="">Choose…</option><option value="M"' + (c.gender === 'M' ? ' selected' : '') + '>Male</option><option value="F"' + (c.gender === 'F' ? ' selected' : '') + '>Female</option></select></div>' +
      '<div><label class="f">Age</label><input type="number" min="3" max="17" data-k="age" data-i="' + i + '" value="' + esc(c.age) + '"></div></div></div>';
  });
  h += '<button class="add" id="addk">+ Add child</button><button class="btn pri" id="reg" style="margin-top:10px">' + (S.busy ? 'Saving…' : 'Save') + '</button></div>';
  return h;
}

function setData(j) {
  S.busy = false;
  if (!j || !j.ok) { S.err = errText(j); render(); return false; }
  S.err = ''; if (j.teachers) S.teachers = j.teachers; if (j.statuses) S.statuses = j.statuses; if (j.stock) S.stock = j.stock; if (S.all && S.phone && j.found !== undefined) S.all[normPhone(S.phone)] = j; return true;
}
function normPhone(p) { var d = String(p || '').replace(/\D/g, ''); if (d.charAt(0) === '0') d = '6' + d; return d; }
function loadAll(cb) {
  api({ action: 'staff_all' }, function (j) {
    if (j && j.ok && j.customers) { S.all = j.customers; S.stock = j.stock; S.prizeList = j.prizeList; S.teachers = j.teachers || S.teachers; S.statuses = j.statuses || S.statuses; cb(j); return; }
    if (j && !j.ok && /^(auth|locked|disabled|nourl)/.test(j.error || '')) { cb(j); return; }
    api({ action: 'staff_stats' }, function (k) { if (k && k.ok) S.all = null; cb(k); });   // older script: fall back to live lookups
  });
}
function localHit(phone) {
  var c = S.all && S.all[normPhone(phone)];
  if (!c || !c.found || !c.children || !c.children.length) return null;
  var o = {}; for (var k in c) o[k] = c[k];
  o.stock = S.stock; o.prizeList = S.prizeList || []; return o;
}
setInterval(function () {
  if (!S.authed || S.busy || !S.all) return;
  api({ action: 'staff_all' }, function (j) { if (j && j.ok && j.customers) { S.all = j.customers; S.stock = j.stock; S.teachers = j.teachers || S.teachers; repaintRecent(); } });
}, 60000);
function refreshStock() { api({ action: 'staff_stats' }, function (j) { if (j && j.ok) { S.stock = j.stock; render(); } }); }

document.addEventListener('click', function (e) {
  var el = e.target.closest('button'); if (!el) return;
  if (el.id === 'login') {
    PIN = document.getElementById('pin').value; S.busy = true; S.err = ''; render();
    loadAll(function (j) {
      S.busy = false;
      if (j && j.ok) { S.authed = true; S.stock = j.stock; try { sessionStorage.setItem('gma_pin', PIN); } catch (x) {} S.err = ''; }
      else { S.err = errText(j); }
      render();
    });
  } else if (el.dataset.chg !== undefined) { openChg(el.dataset.chg);
  } else if (el.id === 'chgcancel') { S.chg = null; render();
  } else if (el.dataset.chgsave !== undefined) {
    var ref = el.dataset.chgsave, svc = el.dataset.svc;
    var dv = document.getElementById('cdate').value, sv = document.getElementById('cslot').value;
    if (!sv) { S.err = 'Please choose a time.'; render(); return; }
    var body = { action: 'staff_reschedule', phone: normPhone(S.phone), ref: ref, date: dv, slot: sv, reportSlot: svc === 'TCBT' ? (S.rs || null) : null, reportDate: svc === 'TCBT' && S.rs ? S.rd : null };
    if (!confirm('Change ' + ref + ' to ' + dv + ' ' + sv + (svc === 'TCBT' ? (S.rs ? ' · report ' + S.rd + ' ' + S.rs : ' · no report time yet') : '') + '?')) return;
    S.busy = true; S.err = ''; render();
    api(body, function (j) {
      S.busy = false;
      if (!j || !j.ok) { S.err = j && j.error === 'taken' ? 'That time was just taken. Please choose another.' : errText(j); render(); return; }
      S.chg = null; S.msg = 'Changed ' + ref + ' to ' + dv + ' ' + sv + '.';
      api({ action: 'staff_lookup', phone: normPhone(S.phone) }, function (k) { if (k && k.ok) { S.data = k; if (S.all) S.all[normPhone(S.phone)] = k; } render(); });
    });
  } else if (el.id === 'logout') {
    PIN = ''; try { sessionStorage.removeItem('gma_pin'); } catch (x) {}
    S.authed = false; S.data = null; S.walk = false; S.phone = ''; S.msg = ''; render();
  } else if (el.id === 'rrefresh') {
    el.textContent = '…'; loadAll(function () { render(); });
  } else if (el.dataset.open) {
    var oc = S.all && S.all[el.dataset.open]; if (!oc) return;
    S.changing = false;
    S.phone = el.dataset.open.replace(/^60/, '0'); S.msg = ''; S.err = ''; S.walk = false;
    var o2 = {}; for (var kk in oc) o2[kk] = oc[kk]; o2.stock = S.stock; o2.prizeList = S.prizeList || []; S.data = o2; render();
    var ph2 = el.dataset.open;
    api({ action: 'staff_lookup', phone: ph2 }, function (k) { if (k && k.ok && S.data && normPhone(S.phone) === ph2) { S.all[ph2] = k; S.data = k; render(); } });
    window.scrollTo(0, 0);
  } else if (el.id === 'find') {
    S.changing = false;
    S.phone = document.getElementById('phone').value; S.msg = ''; S.err = '';
    if (!/^(\+?6?0)1\d[- ]?\d{7,8}$/.test(S.phone.replace(/\s/g, ''))) { S.err = 'Please enter a valid Malaysian mobile number.'; render(); return; }
    var hit = localHit(S.phone);
    if (hit) {
      S.data = hit; S.walk = false; S.busy = false; render();
      var ph = S.phone;   // quietly confirm with the sheet in the background
      api({ action: 'staff_lookup', phone: normPhone(ph) }, function (k) { if (k && k.ok && S.phone === ph && S.data && !S.busy) { S.all[normPhone(ph)] = k; S.data = k; if (!/INPUT|SELECT|TEXTAREA/.test((document.activeElement || {}).tagName || '')) render(); } });
      return;
    }   // instant: loaded at login
    S.busy = true; render();
    api({ action: 'staff_lookup', phone: normPhone(S.phone) }, function (j) {
      if (!setData(j)) return;
      if (j.found && j.children && j.children.length) { S.data = j; S.walk = false; } else { S.data = null; S.walk = true; S.kids = [{ name: '', gender: '', age: '' }]; S.parent = j.parent || ''; }
      render();
    });
  } else if (el.id === 'fsave') {
    var tn = document.getElementById('fteacher').value, fs = document.getElementById('fstatus').value, fnn = document.getElementById('fnote').value;
    S.busy = true; el.disabled = true;
    api({ action: 'staff_follow', phone: normPhone(S.phone), teacher: tn, status: fs, note: fnn }, function (j) {
      S.busy = false;
      if (j && j.ok) { S.data.follow = j.follow; if (S.all && S.all[normPhone(S.phone)]) S.all[normPhone(S.phone)].follow = j.follow; S.msg = 'Follow-up saved.'; S.err = ''; }
      else { S.err = j && j.error === 'noteacher' ? 'That teacher has no name yet. Add it in [6] Settings.' : errText(j); S.msg = ''; }
      render(); window.scrollTo(0, 0);
    });
  } else if (el.id === 'chgprize') { S.changing = true; render();
  } else if (el.id === 'cancelchg') { S.changing = false; render();
  } else if (el.dataset.spin !== undefined) {
    var key = el.dataset.prize;
    var pn = (S.data.prizeList.filter(function (p) { return p.key === key; })[0] || {}).name;
    var chg = !!S.changing;
    if (!confirm(chg ? 'Change the prize to "' + pn + '"? The old voucher codes will be cancelled.' : 'Record "' + pn + '" for the whole family? Only one spin is allowed.')) return;
    S.busy = true; S.msg = ''; render();
    api({ action: 'staff_spin', phone: normPhone(S.phone), prize: key, change: chg }, function (j) {
      if (j && j.ok) S.changing = false;
      if (!setData(j)) return;
      S.data = j; S.msg = 'Saved: ' + pn; render();
    });
  } else if (el.id === 'addk') { S.kids.push({ name: '', gender: '', age: '' }); render(); }
  else if (el.id === 'reg') {
    var kids = S.kids.filter(function (k) { return k.name.trim(); });
    if (!S.parent.trim() || !kids.length || kids.some(function (k) { return !k.gender || !(+k.age >= 3 && +k.age <= 17); })) { S.err = 'Please fill in the parent name, and each child\'s name, gender and age.'; render(); return; }
    S.busy = true; S.err = ''; render();
    api({ action: 'staff_register', phone: normPhone(S.phone), parent: S.parent, children: kids }, function (j) {
      if (!setData(j)) return;
      S.data = j; S.walk = false; S.msg = 'Registered.'; render();
    });
  } else if (el.id === 'redeem') {
    var code = document.getElementById('code').value.trim().toUpperCase(); if (!code) return;
    S.busy = true; S.err = ''; S.msg = ''; api({ action: 'staff_redeem', code: code }, function (j) {
      S.busy = false;
      if (j && j.ok) S.msg = 'Collected: ' + j.prize + ' for ' + j.child + ' (' + j.parent + ')'; else S.err = errText(j);
      render();
    });
  }
});
document.addEventListener('input', function (e) {
  var el = e.target;
  if (el.dataset.p === 'parent') S.parent = el.value;
  else if (el.dataset.k) S.kids[+el.dataset.i][el.dataset.k] = el.value;
});
document.addEventListener('change', function (e) {
  var el = e.target;
  if (el.id === 'cdate') { S.cd = el.value; S.cs = ''; render(); return; }
  if (el.id === 'cslot') {
    S.cs = el.value;
    var cb = (S.data.bookings || []).filter(function (x) { return x.ref === S.chg; })[0];
    if (cb && cb.service === 'TCBT' && S.cs && !S.rs) {   // pre-fill the matching report time when it is free
      var rf0 = reportFor(S.cd, S.cs), h0 = rf0 && ((S.taken && S.taken.report || {})[S.cd + '|' + rf0]);
      if (rf0 && !h0) { S.rd = S.cd; S.rs = rf0; }
    }
    render(); return;
  }
  if (el.id === 'rdate') { S.rd = el.value; S.rs = ''; render(); return; }
  if (el.id === 'rslot') { S.rs = el.value; render(); return; }
  if (el.dataset.k && el.tagName === 'SELECT') S.kids[+el.dataset.i][el.dataset.k] = el.value;
});

if (LOGO_URL) { var lg = document.getElementById('logo'), im = new Image(); im.className = 'brandlogo'; im.alt = ''; im.src = LOGO_URL; im.onload = function () { lg.replaceWith(im); }; }
if (PIN && SUBMIT_URL) { loadAll(function (j) { if (j && j.ok) { S.authed = true; S.stock = j.stock; } render(); }); } else render();
</script>
</body>
</html>
